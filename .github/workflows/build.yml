name: Build and Release

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows MSVC (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Run Tests (Native MSVC)
        run: cargo test --release --target x86_64-pc-windows-msvc

      - name: Build Release Binary (Native MSVC)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpha-cli-windows-msvc-x64
          path: target/x86_64-pc-windows-msvc/release/alpha-cli.exe

  build-linux:
    name: Build Linux (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test --release

      - name: Build Release Binary
        run: cargo build --release

      - name: Upload Linux Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpha-cli-linux-x64
          path: target/release/alpha-cli

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: alpha-cli-windows-msvc-x64
          path: release-bins/windows

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: alpha-cli-linux-x64
          path: release-bins/linux

      - name: Package Release Assets
        run: |
          mkdir -p dist
          cp release-bins/windows/alpha-cli.exe dist/alpha-cli-windows-x64.exe
          cp release-bins/linux/alpha-cli dist/alpha-cli-linux-x64
          chmod +x dist/alpha-cli-linux-x64
          cd dist
          tar -czf alpha-cli-linux-x64.tar.gz alpha-cli-linux-x64
          zip alpha-cli-windows-x64.zip alpha-cli-windows-x64.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/alpha-cli-windows-x64.zip
            dist/alpha-cli-windows-x64.exe
            dist/alpha-cli-linux-x64.tar.gz
            dist/alpha-cli-linux-x64
          draft: false
          prerelease: false
          generate_release_notes: true
