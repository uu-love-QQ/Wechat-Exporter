[package]
name = "wechat-exporter"
version = "0.1.0"
edition = "2021"
description = "WeChat 4.x local database decryptor and multi-format chat exporter"
license = "MIT"

[[bin]]
name = "wechat-exporter"
path = "src/main.rs"

[[bin]]
name = "alpha-cli"
path = "src/main.rs"

[[bin]]
name = "alpha-fixture"
path = "src/bin/make_fixture.rs"

[dependencies]
aes = "0.8"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
hmac = "0.13.0"
md-5 = "0.10"
pbkdf2 = "0.13.0"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
rust_xlsxwriter = "0.90"
ruzstd = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
lto = "thin"
